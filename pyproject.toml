[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eb-alpamayo-integration"
version = "0.1.0"
description = "Professional integration toolkit for NVIDIA Alpamayo 1 VLA model in automotive research"
authors = [
    {name = "EB-Alpamayo Contributors", email = "research@your-domain.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["autonomous-driving", "nvidia", "alpamayo", "vla", "automotive", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core ML dependencies
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",  # For quantization
    
    # Vision processing
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    
    # Data handling
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    
    # Jupyter/notebook support
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    
    # Logging and monitoring
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    
    # Configuration
    "pydantic>=2.0.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.0",
    
    # HuggingFace
    "huggingface-hub>=0.19.0",
    "datasets>=2.14.0",
    
    # Safety and validation
    "scipy>=1.11.0",
    "shapely>=2.0.0",  # For geometric collision checks
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

alpasim = [
    # AlpaSim will be installed via git+https://github.com/NVlabs/alpasim.git
    # Listed here for documentation purposes
]

ros2 = [
    # ROS2 integration (optional)
    # Users should install ROS2 separately via apt/conda
]

all = [
    "eb-alpamayo-integration[dev,alpasim]",
]

[project.urls]
Homepage = "https://github.com/your-org/EB-Alpamayo-Integration-Starter"
Documentation = "https://github.com/your-org/EB-Alpamayo-Integration-Starter/blob/main/README.md"
Repository = "https://github.com/your-org/EB-Alpamayo-Integration-Starter"
"Bug Tracker" = "https://github.com/your-org/EB-Alpamayo-Integration-Starter/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/*" = ["B011"]      # Assert false in tests

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "PIL.*",
    "cv2.*",
    "matplotlib.*",
    "plotly.*",
    "scipy.*",
    "shapely.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
